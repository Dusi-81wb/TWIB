# TWIB development Docker Compose stack.
#
# Runs the backend together with its supporting services (PostgreSQL,
# Redis, Qdrant) on a single development bridge network. Configuration is
# read from backend/.env through the existing settings system; no secrets
# are hardcoded here.

name: twib

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: twib-backend
    env_file:
      - ../../backend/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ../../backend/app:/app/app
      - ../../backend/tests:/app/tests
      - ../../backend/pytest.ini:/app/pytest.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - twib-dev

  postgres:
    image: postgres:17-alpine
    container_name: twib-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twib}
      POSTGRES_DB: ${POSTGRES_DB:-twib}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twib} -d ${POSTGRES_DB:-twib}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - twib-dev

  redis:
    image: redis:7-alpine
    container_name: twib-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - twib-dev

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: twib-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - twib-dev

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  twib-dev:
    driver: bridge
